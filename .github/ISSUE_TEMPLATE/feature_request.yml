name: Feature request
description: Propose an addition or change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? If it tracks a WebMCP spec issue, link it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the code you'd like to write.
    validations:
      required: true
