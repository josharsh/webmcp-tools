name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm -r --filter './packages/*' typecheck
      - run: pnpm vitest run
      - run: pnpm --filter @josharsh/webmcp-example-todo build
      - run: pnpm lint
      - name: Check package types (attw)
        run: |
          npx --yes @arethetypeswrong/cli --pack packages/core
          npx --yes @arethetypeswrong/cli --pack packages/react
